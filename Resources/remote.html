<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pikaso Workstation</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--hi:#262a33;--text:#e8eaee;--dim:#8a91a0;--lcd:#8fe9ff;--lcdbg:#0b1a20;--acc:#ff8a3d;--red:#ff4d5e;--green:#3ddc84;--master:#c58aff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:var(--text);background:var(--hi);border:0;border-radius:8px;padding:0 10px;min-height:40px;font-weight:700;cursor:pointer}
button.on{background:var(--acc);color:#111}
button:active{filter:brightness(1.25)}
#top{display:flex;gap:8px;align-items:stretch;padding:8px;background:var(--panel);border-bottom:1px solid var(--hi);height:72px}
#lcd{flex:1 1 auto;min-width:0;background:linear-gradient(var(--lcdbg),#081216);border:1px solid #8fe9ff33;border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#lcd small{color:#8fe9ffaa;font-size:11px;font-weight:700;letter-spacing:.5px}
#lcd b{color:var(--lcd);font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#harm{min-width:150px;text-align:left;line-height:1.1;border:1px solid var(--dim)}
#harm.on{background:#3ddc8440;border-color:var(--green);color:var(--text)}
#harm small{display:block;font-size:11px;color:var(--dim)}
#dot{width:12px;height:12px;border-radius:50%;background:var(--red);align-self:center;flex:0 0 12px}
#dot.ok{background:var(--green)}
#tabs{display:flex;gap:6px;padding:6px 8px}
#tabs button{flex:1;min-height:44px;background:var(--bg);border:1px solid var(--hi)}
#tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
#main{position:absolute;top:136px;left:0;right:0;bottom:0;overflow:auto;padding:6px 8px 20px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.part{background:var(--panel);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;position:relative}
.part.off{opacity:.55}
.part .bar{height:4px;border-radius:2px;margin:0 4px 2px}
.usr{display:flex;gap:3px}
.usr button{min-height:44px}
.usr .nm{flex:1;min-width:0;background:var(--bg);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.usr .st{flex:0 0 26px;padding:0}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.knob{display:flex;flex-direction:column;align-items:center;touch-action:none;padding:2px 0}
.knob label{font-size:11px;font-weight:700;color:#e8eaeedd;white-space:nowrap;overflow:hidden;max-width:100%}
.knob svg{width:52px;height:52px}
.knob span{font-size:11px;color:var(--dim);white-space:nowrap}
.knob.active span{color:var(--lcd)}
.step{display:flex;align-items:center;gap:3px}
.step label{flex:0 0 38px;font-size:10px;color:var(--dim);font-weight:700;overflow:hidden}
.step b{flex:1 1 20px;min-width:20px;text-align:center;background:var(--bg);border-radius:6px;padding:7px 0;font-size:13px}
.step button{flex:0 0 26px;padding:0;min-height:34px;min-width:0}
.step{min-width:0}
.tg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.tg3 button{font-size:11px;padding:0;min-height:36px}
.small{font-size:11px;min-height:32px}
.sect{background:var(--panel);border-radius:10px;padding:8px;margin-top:8px}
.sect h3{margin:0 0 6px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.kgrid{display:flex;flex-wrap:wrap;gap:4px}
.kgrid .knob{width:84px}
.ms{display:grid;grid-template-columns:62px 30px minmax(120px,1fr) 30px 70px 70px 120px 70px 44px 44px 52px;gap:4px;align-items:center;background:var(--panel);border-radius:8px;padding:3px 4px;margin-top:4px}
.ms .knob svg{width:36px;height:36px}
.ms .knob label{display:none}
.ms .nm{background:var(--bg);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-height:40px}
.msh{display:grid;grid-template-columns:62px 30px minmax(120px,1fr) 30px 70px 70px 120px 70px 44px 44px 52px;gap:4px;font-size:11px;color:var(--dim);font-weight:700;padding:6px 4px 0;text-align:center}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{min-height:40px}
select{font:inherit;color:var(--text);background:var(--hi);border:0;border-radius:8px;min-height:40px;padding:0 8px}
#modal{position:fixed;inset:0;background:#000a;display:none;z-index:10;align-items:flex-start;justify-content:center;padding-top:40px}
#modal.open{display:flex}
#box{background:var(--panel);border-radius:12px;width:min(640px,94vw);max-height:84vh;display:flex;flex-direction:column;padding:10px;gap:8px}
#box input{font:inherit;font-size:18px;padding:10px;border-radius:8px;border:1px solid var(--hi);background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
#list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px}
#list button{text-align:left;background:var(--bg);font-weight:500;min-height:44px}
#list button.cur{background:#ff8a3d55}
#list button.act{color:var(--lcd)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{min-height:34px;font-size:12px}
#pad{width:110px;height:72px;background:var(--bg);border:1px solid #ff8a3d88;border-radius:8px;position:relative;touch-action:none}
#pad i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--lcd);margin:-6px 0 0 -6px}
#pad:before,#pad:after{content:"";position:absolute;background:var(--hi)}
#pad:before{left:50%;top:0;bottom:0;width:1px}#pad:after{top:50%;left:0;right:0;height:1px}
.hint{color:var(--dim);font-size:12px}
#off{position:fixed;inset:136px 0 0 0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim);font-size:18px;background:var(--bg);z-index:5}
#off.show{display:flex}
#zones{position:relative;background:var(--panel);border-radius:10px;margin-top:6px;padding:6px 10px 4px;touch-action:none}
#zones .zb{position:absolute;border-radius:4px;font-size:11px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;padding:0 6px;display:flex;align-items:center}
#zones .zb.drag{outline:2px solid #fff}
.kb{position:relative;height:18px;background:#dcdcdc;border-radius:3px;margin-top:3px}
.kb i{position:absolute;top:0;height:62%;background:#1a1a1a}
.kb s{position:absolute;top:0;bottom:0;width:1px;background:#9a9a9a}
.kb u{position:absolute;top:0;bottom:0;background:#ff8a3d88}
.grid8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:6px}
.cell{background:var(--panel);border-radius:6px;min-height:46px;padding:3px 5px;font-size:12px;font-weight:600;text-align:left;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-left:5px solid transparent}
.cell small{color:var(--dim);font-size:10px}
.cell.empty{opacity:.4}
.cell.cur{background:#ff8a3d55}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.big button{min-height:84px;font-size:18px;white-space:normal;line-height:1.15}
.big button.cur{outline:3px solid var(--lcd)}
.hs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.hs button{flex:0 0 auto;font-size:12px;min-height:36px}
table.zt{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.zt td,table.zt th{padding:5px 4px;border-bottom:1px solid var(--hi);text-align:center;white-space:nowrap}
table.zt th{color:var(--dim);font-size:11px}
table.zt td:first-child{text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.zt tr.sel{background:#ff8a3d40}
#zmap{position:relative;height:150px;background:var(--bg);border-radius:8px;margin-top:6px;touch-action:none;overflow:hidden}
#zmap .z{position:absolute;border:1px solid #000a;border-radius:2px;opacity:.8}
#zmap .z.sel{opacity:1;outline:2px solid #fff;z-index:2}
.notes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.notes button{min-height:36px;padding:0;font-size:12px}
.stpx{display:flex;flex-direction:column;align-items:center;gap:2px}
.stpx b{background:var(--bg);border-radius:6px;padding:5px 0;width:100%;text-align:center;font-size:13px}
.stpx button{min-height:30px;width:100%;padding:0}
.lab{font-size:11px;color:var(--dim);font-weight:700}
@media (max-width:1000px){.parts{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="top">
  <button id="back" title="Back to Live Kontroler">◀</button>
  <div id="dot"></div>
  <div id="lcd"><small id="slotLine">PERFORMANCE</small><b id="perfName">—</b></div>
  <button id="prev" title="Previous performance in the list">◀ PERF</button>
  <button id="next" title="Next performance in the list">PERF ▶</button>
  <button id="save" style="background:#b8343f" title="Save to the current slot">SAVE</button>
  <button id="harm"><small>HARMONY</small><span id="harmText">—</span></button>
  <button id="panic" style="background:#7a2230">PANIC</button>
</div>
<div id="tabs"><button data-tab="perf">PERFORMANCE</button><button data-tab="user">USER EDIT</button><button data-tab="fx">EFFECTS</button><button data-tab="lists">LISTS</button><button data-tab="map">MAPPING</button><button data-tab="harm">HARMONY</button></div>
<div id="main"></div>
<div id="off"><div>Pikaso Workstation is not connected</div><div class="hint">Start Pikaso Workstation on the mini PC (port 8091).</div></div>
<div id="modal"><div id="box"></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const PCOL = ["#ff8a3d","#3dc5ff","#7ddf64","#ff5c8a","#c58aff","#ffd23d","#3dffd0","#ff9be0","#d9a066","#6f9dff","#b8e05a","#ff7a6b","#9be7ff","#e8c9ff","#5fd39b","#ffb36b"];
let S = { status:{}, perf:null, users:{list:[],cats:[]}, user:{index:-1}, meta:{fx:[]}, lists:null, setlist:null, terca:null, map:null };
let listMode = "recall", listSub = "perf", slPage = 0, slMode = "play", mapSel = -1, mapOpt = { neighbours: true, files: false }, tScale = 0;
let tab = "perf", partPage = 0, osc = 0, section = "filter", built = "", ctrls = [], instruments = [], instVer = "";
const holdUntil = {};           // control path -> time until incoming values are ignored (while touching)

// ---------- formatting ----------
const F = {
  db: v => v <= -59.5 ? "-inf" : v.toFixed(1) + " dB",
  dbs: v => (v > 0 ? "+" : "") + v.toFixed(1) + " dB",
  pan: v => { const x = Math.round(v * 50); return x === 0 ? "C" : (x < 0 ? "L" + (-x) : "R" + x); },
  pct: v => Math.round(v * 100) + "%",
  hz: v => v < 1000 ? Math.round(v) + " Hz" : (v / 1000).toFixed(1) + " kHz",
  hz2: v => v.toFixed(2) + " Hz",
  time: v => v < 1 ? Math.round(v * 1000) + " ms" : v.toFixed(2) + " s",
  ms: v => Math.round(v) + " ms",
  sec: v => v.toFixed(1) + " s",
  st: v => (v > 0 ? "+" : "") + v.toFixed(1) + " st",
  oct: v => (v > 0 ? "+" : "") + v.toFixed(1) + " oct",
  cents: v => Math.round(v) + " c",
  lvl: v => String(Math.round(v * 100)),
  n2: v => v.toFixed(2),
  ratio: v => v.toFixed(1) + ":1",
  semis: v => { const x = Math.round(v); return x > 0 ? "+" + x : String(x); },
  int: v => String(Math.round(v))
};

// ---------- state paths: "Part[3]@volume", "Block[1]/AmpEG@aTime", "@voiceMode" ----------
function nodeOf(root, path, create) {
  const ep = path.split("@")[0];
  let o = root;
  if (!o) return null;
  for (const seg of ep.split("/").filter(Boolean)) {
    const m = seg.match(/^(\w+)(?:\[(\d+)\])?$/); if (!m) return null;
    let arr = o[m[1]];
    if (!Array.isArray(arr)) { if (!create) return null; arr = o[m[1]] = []; }
    let n = m[2] !== undefined ? arr.find(x => x.index == +m[2]) : arr[0];
    if (!n) { if (!create) return null; n = m[2] !== undefined ? { index: +m[2] } : {}; arr.push(n); }
    o = n;
  }
  return o;
}
function rootOf(target) { return target === "perf" ? S.perf : (S.user && S.user.data); }
function getV(target, path, def) {
  const n = nodeOf(rootOf(target), path, false); if (!n) return def;
  const v = n[path.split("@")[1]];
  return v === undefined ? def : v;
}
function setLocal(target, path, v) {
  const n = nodeOf(rootOf(target), path, true); if (n) n[path.split("@")[1]] = v;
}

// ---------- server ----------
let es = null, connected = false;
function connect() {
  try { es && es.close(); } catch (e) {}
  es = new EventSource("/events");
  es.onopen = () => setConn(true);
  es.onerror = () => { setConn(false); };
  es.onmessage = e => { try { onState(JSON.parse(e.data)); } catch (x) {} };
}
function setConn(ok) { connected = ok; $("dot").className = ok ? "ok" : ""; $("off").classList.toggle("show", !ok && !S.perf); }
const queue = []; let posting = false;
function api(obj) {
  queue.push(obj);
  if (posting) return;
  posting = true;
  setTimeout(flush, 0);
}
function flush() {
  if (!queue.length) { posting = false; return; }
  // isti cilj+putanja: samo poslednja vrednost
  const merged = [], seen = {};
  for (const q of queue.splice(0)) {
    if (q.op === "set" && q.sets.length === 1) { const k = q.target + q.sets[0][0] + (q.index ?? ""); if (seen[k] !== undefined) { merged[seen[k]] = q; continue; } seen[k] = merged.length; }
    merged.push(q);
  }
  fetch("/api", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(merged) })
    .catch(() => {}).finally(() => setTimeout(flush, 30));
}
function setP(target, path, v) {
  setLocal(target, path, v);
  const o = { op: "set", target, sets: [[path, v]] };
  if (target === "user") o.index = S.user.index;
  api(o);
}
function setMany(target, sets) {
  sets.forEach(s => setLocal(target, s[0], s[1]));
  const o = { op: "set", target, sets }; if (target === "user") o.index = S.user.index;
  api(o);
}

function onState(m) {
  const now = Date.now();
  if (m.status) S.status = m.status;
  if (m.meta) { S.meta = m.meta; if (m.meta.instVer !== instVer) { instVer = m.meta.instVer; loadInstruments(); } }
  if (m.users) S.users = m.users;
  if (m.lists) S.lists = m.lists;
  if (m.setlist) S.setlist = m.setlist;
  if (m.terca) S.terca = m.terca;
  if (m.map) S.map = m.map;
  // vrednosti koje korisnik upravo pomera ne vracaj nazad (da knob ne skace)
  const keep = (target, fresh) => {
    const old = rootOf(target);
    if (!old) return fresh;
    for (const k in holdUntil) if (holdUntil[k] > now && k.startsWith(target + ":")) {
      const p = k.slice(target.length + 1), v = getV(target, p, undefined);
      if (v !== undefined) { const n = nodeOf(fresh, p, true); if (n) n[p.split("@")[1]] = v; }
    }
    return fresh;
  };
  if (m.perf) S.perf = keep("perf", m.perf);
  if (m.user) { if (S.user && m.user.index === S.user.index && m.user.data) m.user.data = keep("user", m.user.data); S.user = m.user; }
  $("off").classList.remove("show");
  render();
}
function loadInstruments() { fetch("/instruments").then(r => r.json()).then(a => { instruments = a; }).catch(() => {}); }

// ---------- controls ----------
function skewOf(lo, hi, c) { return (c > lo && c < hi) ? Math.log(0.5) / Math.log((c - lo) / (hi - lo)) : 1; }
function toProp(v, lo, hi, sk) { const p = Math.min(1, Math.max(0, (v - lo) / (hi - lo))); return sk === 1 ? p : Math.pow(p, sk); }
function fromProp(p, lo, hi, sk) { p = Math.min(1, Math.max(0, p)); return lo + (hi - lo) * (sk === 1 ? p : Math.exp(Math.log(Math.max(p, 1e-9)) / sk)); }
function arc(p, col, bip, pz) {
  const a0 = -135, a1 = 135, R = 20, cx = 26, cy = 26;
  const pt = a => { const r = (a - 90) * Math.PI / 180; return [cx + R * Math.cos(r), cy + R * Math.sin(r)]; };
  const path = (from, to) => { const [x0, y0] = pt(from), [x1, y1] = pt(to); return `M${x0} ${y0} A${R} ${R} 0 ${Math.abs(to - from) > 180 ? 1 : 0} ${to > from ? 1 : 0} ${x1} ${y1}`; };
  const av = a0 + p * (a1 - a0), az = bip ? a0 + pz * (a1 - a0) : a0;
  const [px, py] = pt(av);
  return `<svg viewBox="0 0 52 52"><path d="${path(a0, a1)}" stroke="#3a3f4a" stroke-width="5" fill="none" stroke-linecap="round"/>` +
    (Math.abs(av - az) > 0.5 ? `<path d="${path(Math.min(av, az), Math.max(av, az))}" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round"/>` : "") +
    `<circle cx="26" cy="26" r="13" fill="#262a33"/><line x1="26" y1="26" x2="${26 + (px - 26) * 0.62}" y2="${26 + (py - 26) * 0.62}" stroke="#e8eaee" stroke-width="3" stroke-linecap="round"/></svg>`;
}
// knob: drag up/down (or left/right), double tap = default
function knob(parent, o) {
  const el = document.createElement("div"); el.className = "knob";
  el.innerHTML = `<label>${o.label || ""}</label><div class="k"></div><span></span>`;
  parent.appendChild(el);
  const sk = skewOf(o.lo, o.hi, o.c ?? o.lo), key = o.target + ":" + o.path;
  const bip = o.lo < 0 && o.hi > 0;
  let cur = o.def;
  const draw = v => { cur = v; el.querySelector(".k").innerHTML = arc(toProp(v, o.lo, o.hi, sk), o.col || "#ff8a3d", bip, toProp(0, o.lo, o.hi, sk)); el.querySelector("span").textContent = (o.fmt || F.n2)(v); };
  const read = () => o.get ? o.get() : getV(o.target, o.path, o.def);
  let sy = 0, sx = 0, sp = 0, lastTap = 0, lastSend = 0;
  const send = (v, force) => { const t = Date.now(); if (!force && t - lastSend < 35) { clearTimeout(el._t); el._t = setTimeout(() => send(v, true), 40); return; } lastSend = t; o.set ? o.set(v) : setP(o.target, o.path, v); };
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("active");
    sy = e.clientY; sx = e.clientX; sp = toProp(read(), o.lo, o.hi, sk); holdUntil[key] = Date.now() + 60000;
    const t = Date.now(); if (t - lastTap < 300 && o.def !== undefined) { draw(o.def); send(o.def, true); } lastTap = t;
  });
  el.addEventListener("pointermove", e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    const d = ((sy - e.clientY) + (e.clientX - sx) * 0.5) / 220;
    let v = fromProp(sp + d, o.lo, o.hi, sk);
    if (o.step) v = Math.round(v / o.step) * o.step;
    if (v !== cur) { draw(v); send(v); }
  });
  const up = e => { el.classList.remove("active"); holdUntil[key] = Date.now() + 700; if (el._t) { clearTimeout(el._t); send(cur, true); } };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  ctrls.push(() => { if (!(holdUntil[key] > Date.now())) draw(+read()); });
  draw(+read());
  return el;
}
function toggle(parent, o) {
  const b = document.createElement("button"); b.textContent = o.label; if (o.cls) b.className = o.cls;
  if (o.title) b.title = o.title;
  parent.appendChild(b);
  const read = () => o.get ? !!o.get() : !!+getV(o.target, o.path, o.def ? 1 : 0);
  b.onclick = () => { const v = !read(); o.set ? o.set(v) : setP(o.target, o.path, v); upd(); };
  const upd = () => { const v = read(); b.classList.toggle("on", v); if (o.onCol) { b.style.background = v ? o.onCol : ""; b.style.color = v ? "#111" : ""; } };
  ctrls.push(upd); upd();
  return b;
}
function stepper(parent, o) {
  const d = document.createElement("div"); d.className = "step";
  d.innerHTML = `<label>${o.label}</label><button>-</button><b></b><button>+</button>`;
  parent.appendChild(d);
  const read = () => +getV(o.target, o.path, o.def || 0);
  const [mi, pl] = d.querySelectorAll("button");
  const chg = s => { const v = Math.min(o.hi, Math.max(o.lo, read() + s)); setP(o.target, o.path, v); upd(); };
  mi.onclick = () => chg(-1); pl.onclick = () => chg(1);
  const upd = () => { d.querySelector("b").textContent = (o.fmt || F.semis)(read()); };
  ctrls.push(upd); upd();
  return d;
}
function seg(parent, o) {
  const d = document.createElement("div"); d.className = "seg"; parent.appendChild(d);
  const bs = o.items.map((t, i) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => { setP(o.target, o.path, i); upd(); }; d.appendChild(b); return b; });
  const upd = () => { const v = +getV(o.target, o.path, o.def || 0); bs.forEach((b, i) => b.classList.toggle("on", i === v)); };
  ctrls.push(upd); upd();
  return d;
}
function el(tag, cls, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));


// ---------- helpers ----------
const NN = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function noteName(n) { n = Math.round(n); return NN[((n % 12) + 12) % 12] + (Math.floor(n / 12) - (S.status.c3 === false ? 1 : 2)); }
function parseNote(t) {
  const m = String(t).trim().toUpperCase().match(/^([A-G])(#|B)?(-?\d+)$/); if (!m) return NaN;
  let pc = NN.indexOf(m[1]); if (m[2] === "#") pc++; if (m[2] === "B") pc--;
  return pc + (+m[3] + (S.status.c3 === false ? 1 : 2)) * 12;
}
// modal sa kontrolama koje se osvezavaju
function modal(title, build) {
  const box = $("box");
  box.innerHTML = `<div class="row"><b style="flex:1;font-size:16px">${esc(title)}</b><button id="mdx">✕</button></div><div id="mdb" style="overflow:auto"></div>`;
  const before = ctrls.length;
  build($("mdb"), () => close());
  const mine = ctrls.splice(before);
  const tick = setInterval(() => mine.forEach(f => f()), 150);
  const close = () => { clearInterval(tick); $("modal").classList.remove("open"); $("modal").onpointerdown = null; };
  $("mdx").onclick = close;
  $("modal").classList.add("open");
  $("modal").onpointerdown = e => { if (e.target.id === "modal") close(); };
  return close;
}
// stepper sa sopstvenim get/set (vertikalni: + gore, - dole)
function stpx(parent, o) {
  const d = el("div", "stpx", "", parent);
  if (o.label !== undefined) el("span", "lab", esc(o.label), d);
  const pl = el("button", "", "+", d), b = el("b", "", "", d), mi = el("button", "", "−", d);
  const chg = s => { const v = Math.min(o.hi, Math.max(o.lo, o.get() + s)); o.set(v); upd(); };
  pl.onclick = () => chg(o.big || 1); mi.onclick = () => chg(-(o.big || 1));
  if (o.big) { pl.oncontextmenu = mi.oncontextmenu = e => e.preventDefault(); }
  const upd = () => { b.textContent = (o.fmt || F.semis)(o.get()); };
  ctrls.push(upd); upd();
  return d;
}
// stepper u redu sa get/set; dugi pritisak = korak 12 (za tastere)
function rowStep(parent, o) {
  const d = el("div", "step", "", parent);
  d.innerHTML = `<label>${esc(o.label)}</label><button>-</button><b></b><button>+</button>`;
  const [mi, pl] = d.querySelectorAll("button");
  const get = o.get || (() => +getV(o.target, o.path, o.def || 0));
  const set = o.set || (v => setP(o.target, o.path, v));
  const chg = s => { const v = Math.min(o.hi, Math.max(o.lo, get() + s)); set(v); upd(); };
  const hold = (btn, s) => { let t = 0, big = false; btn.onpointerdown = () => { big = false; t = setTimeout(() => { big = true; chg(s * (o.big || 10)); }, 450); }; btn.onpointerup = btn.onpointerleave = () => clearTimeout(t); btn.onclick = () => { if (!big) chg(s); }; };
  hold(mi, -1); hold(pl, 1);
  const upd = () => { d.querySelector("b").textContent = (o.fmt || F.semis)(get()); };
  ctrls.push(upd); upd();
  return d;
}
// mala klavijatura 21..108 u elementu
function miniKeys(parent, lo, hi) {
  const kb = el("div", "kb", "", parent); const n = hi - lo + 1;
  for (let k = lo; k <= hi; k++) { const pc = k % 12, x = (k - lo) / n * 100;
    if (pc === 0 || pc === 5) { const s = el("s", "", "", kb); s.style.left = x + "%"; }
    if ([1, 3, 6, 8, 10].includes(pc)) { const i = el("i", "", "", kb); i.style.left = x + "%"; i.style.width = (100 / n) + "%"; } }
  return kb;
}

// ---------- picker (search) ----------
function picker(title, items, current, actions, onPick, chips) {
  // items: [{label, value, cat}]
  const box = $("box");
  box.innerHTML = `<div class="row"><b style="flex:1;font-size:16px">${esc(title)}</b><button id="pkx">✕</button></div><input id="pkq" placeholder="Search..." autocomplete="off"><div class="chips" id="pkc"></div><div id="list"></div>`;
  let cat = null;
  const q = $("pkq"), list = $("list");
  const draw = () => {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    list.innerHTML = "";
    if (!words.length && !cat) (actions || []).forEach((a, i) => { const b = el("button", "act", esc(a), list); b.onclick = () => { close(); onPick(i, null); }; });
    let n = 0;
    for (const it of items) {
      if (cat !== null && (it.cat || "") !== cat) continue;
      const lab = it.label.toLowerCase();
      if (words.some(w => !lab.includes(w))) continue;
      if (++n > 400) break;
      const b = el("button", it.value === current ? "cur" : "", esc(it.label), list);
      b.onclick = () => { close(); onPick(-1, it.value); };
    }
    const c = list.querySelector(".cur"); if (c && !words.length) c.scrollIntoView({ block: "center" });
  };
  if (chips && chips.length) {
    const pc = $("pkc");
    const mk = (t, v) => { const b = el("button", "", esc(t), pc); b.onclick = () => { cat = cat === v ? null : v; pc.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b && cat !== null)); draw(); }; };
    mk("No category", ""); chips.forEach(c => mk(c, c));
  }
  const close = () => $("modal").classList.remove("open");
  $("pkx").onclick = close;
  q.oninput = draw;
  q.onkeydown = e => { if (e.key === "Enter") { const b = list.querySelector("button:not(.act)"); if (b) b.click(); } if (e.key === "Escape") close(); };
  $("modal").classList.add("open");
  draw();
  setTimeout(() => q.focus(), 50);
}
$("modal").addEventListener("pointerdown", e => { if (e.target.id === "modal") $("modal").classList.remove("open"); });
function userItems() { return S.users.list.map((u, i) => ({ label: String(i + 1).padStart(3, "0") + "  " + u[0] + (u[1] ? "   [" + u[1] + "]" : ""), value: u[0], cat: u[1] || "" })); }
function userIndexOf(name) { return S.users.list.findIndex(u => u[0] === name); }

// ---------- pages ----------
function partOf(i) { return nodeOf(S.perf, "Part[" + i + "]@x", false) || {}; }

function buildPerf(m) {
  const top = el("div", "row", "", m);
  [0, 1].forEach(p => { const b = el("button", partPage === p ? "on" : "", p ? "PARTS 9-16" : "PARTS 1-8", top); b.onclick = () => { partPage = p; built = ""; render(); }; });
  el("span", "", "", top).style.flex = "1";
  el("button", "", "RENAME", top).onclick = () => { const n = prompt("Performance name", S.status.name || ""); if (n && n.trim()) api({ op: "perfName", name: n.trim() }); };
  const catB = el("button", "", "", top);
  catB.onclick = () => { const cs = (S.lists && S.lists.cats) || []; picker("Performance category", cs.map(x => ({ label: x[0], value: x[0] })), S.perf.categoryName || "", ["(no category)"], (a, v) => setP("perf", "@categoryName", a === 0 ? "" : v)); };
  ctrls.push(() => { catB.textContent = "CAT: " + (S.perf.categoryName || "—"); });
  toggle(top, { label: "VECTOR", target: "perf", path: "@vector", title: "Vector joystick changes part volumes" });
  toggle(top, { label: "EQ.POW", target: "perf", path: "@vectorEqualPower" });
  const pad = el("div", "", "<i></i>", top); pad.id = "pad";
  const dot = pad.querySelector("i");
  let padHold = 0;
  const padMove = e => {
    const r = pad.getBoundingClientRect();
    const x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1)), y = Math.max(-1, Math.min(1, 1 - ((e.clientY - r.top) / r.height) * 2));
    padHold = Date.now() + 600; S.status.vx = x; S.status.vy = y; padUpd(); api({ op: "vector", x, y });
  };
  pad.addEventListener("pointerdown", e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); padMove(e); });
  pad.addEventListener("pointermove", e => { if (pad.hasPointerCapture(e.pointerId)) padMove(e); });
  pad.addEventListener("dblclick", () => api({ op: "vector", x: 0, y: 0 }));
  const padUpd = () => { dot.style.left = ((+S.status.vx || 0) + 1) * 50 + "%"; dot.style.top = (1 - (+S.status.vy || 0)) * 50 + "%"; };
  ctrls.push(() => { if (padHold < Date.now()) padUpd(); }); padUpd();

  const grid = el("div", "parts", "", m);
  for (let i = partPage * 8; i < partPage * 8 + 8; i++) {
    const col = PCOL[i], P = "Part[" + i + "]";
    const c = el("div", "part", "", grid);
    const bar = el("div", "bar", "", c); bar.style.background = col;
    toggle(c, { label: "PART " + (i + 1), target: "perf", path: P + "@on", onCol: col });
    const u = el("div", "usr", "", c);
    const mi = el("button", "st", "-", u), nm = el("button", "nm", "", u), pl = el("button", "st", "+", u);
    const step = d => {
      const n = S.users.list.length; if (!n) return;
      const cur = userIndexOf(partOf(i).user || "");
      const nx = cur < 0 ? (d > 0 ? 0 : n - 1) : Math.max(0, Math.min(n - 1, cur + d));
      setMany("perf", [[P + "@user", S.users.list[nx][0]], [P + "@on", true]]); render();
    };
    mi.onclick = () => step(-1); pl.onclick = () => step(1);
    nm.onclick = () => picker("Part " + (i + 1) + ": user", userItems(), partOf(i).user || "", ["+ New user from multisample...", "+ Empty new user", "(no user)"], (a, v) => {
      if (a === 0) return pickInstrument("New user from multisample", "", inst => { if (inst) api({ op: "newUser", instrument: inst, part: i }); });
      if (a === 1) return api({ op: "newUser", instrument: "", part: i });
      if (a === 2) return setMany("perf", [[P + "@user", ""], [P + "@on", false]]);
      setMany("perf", [[P + "@user", v], [P + "@on", true]]); render();
    }, S.users.cats);
    ctrls.push(() => { const pp = partOf(i); nm.textContent = pp.user || (pp.missingName ? "⚠ " + pp.missingName : "— choose user —"); nm.style.background = !pp.user && pp.missingName ? "#5a2230" : ""; c.classList.toggle("off", !+pp.on); });
    const k = el("div", "knobs", "", c);
    knob(k, { label: "Volume", target: "perf", path: P + "@volume", lo: -60, hi: 6, c: -12, def: 0, fmt: F.db, col });
    knob(k, { label: "Pan", target: "perf", path: P + "@pan", lo: -1, hi: 1, c: 0, def: 0, fmt: F.pan, col });
    knob(k, { label: "Reverb", target: "perf", path: P + "@reverb", lo: 0, hi: 1, def: 0.2, fmt: F.pct, col });
    knob(k, { label: "Delay", target: "perf", path: P + "@delay", lo: 0, hi: 1, def: 0, fmt: F.pct, col });
    stepper(c, { label: "Transp", target: "perf", path: P + "@transpose", lo: -24, hi: 24 });
    stepper(c, { label: "Octave", target: "perf", path: P + "@octave", lo: -3, hi: 3 });
    const t3 = el("div", "tg3", "", c);
    toggle(t3, { label: "HARM", target: "perf", path: P + "@terca", onCol: "#3ddc84" });
    toggle(t3, { label: "SUST", target: "perf", path: P + "@sustain", def: true, onCol: "#8a91a0" });
    toggle(t3, { label: "EXPR", target: "perf", path: P + "@expression", def: true, onCol: "#8a91a0" });
    const t2 = el("div", "tg3", "", c);
    const eq = el("button", "", "EQ", t2);
    eq.onclick = () => eqBox("Part " + (i + 1) + " EQ (added to the user EQ)", "perf", P, [["Low", "eqLow", -15, 15], ["Mid", "eqMid", -15, 15], ["High", "eqHigh", -15, 15]], col);
    el("button", "", "KEYS", t2).onclick = () => partKeys(i);
    const ed = el("button", "", "EDIT", t2);
    ed.onclick = () => { const ui = userIndexOf(partOf(i).user || ""); if (ui < 0) return; api({ op: "editUser", index: ui }); S.user = { index: ui }; tab = "user"; built = ""; render(); };
  }
  zoneStrip(m);
}


// raspon tastera svih delova: povuci ivicu (donji / gornji taster) ili sredinu (cela zona)
function zoneStrip(m) {
  const LO = 21, HI = 108, N = HI - LO + 1;
  const wrap = el("div", "", "", m); wrap.id = "zones";
  const area = el("div", "", "", wrap); area.style.position = "relative";
  miniKeys(wrap, LO, HI);
  const hint = el("div", "hint", "Drag an edge to set the low / high key, drag the middle to move the whole zone.", wrap); hint.style.fontSize = "11px";
  let drag = null;
  const active = () => { const a = []; for (let i = 0; i < 16; i++) { const p = partOf(i); if (+p.on && (p.user || p.missingName)) a.push(i); } return a; };
  const draw = () => {
    const a = active(); area.style.height = Math.max(20, a.length * 20) + "px";
    area.innerHTML = a.length ? "" : "<div class='hint' style='text-align:center'>No part is on</div>";
    a.forEach((i, k) => {
      const p = partOf(i), lo = Math.max(LO, Math.min(HI, +p.keyLow || 0)), hi = Math.max(LO, Math.min(HI, p.keyHigh === undefined ? 127 : +p.keyHigh));
      const b = el("div", "zb" + (drag && drag.i === i ? " drag" : ""), "", area);
      b.style.left = ((lo - LO) / N * 100) + "%"; b.style.width = ((hi - lo + 1) / N * 100) + "%"; b.style.top = (k * 20 + 1) + "px"; b.style.height = "18px"; b.style.background = PCOL[i];
      const tr = (+p.octave || 0) * 12 + (+p.transpose || 0);
      b.textContent = (i + 1) + "  " + (p.user || "⚠ " + p.missingName) + (tr ? "  (" + (tr > 0 ? "+" : "") + tr + ")" : "") + "   " + noteName(+p.keyLow || 0) + "–" + noteName(p.keyHigh === undefined ? 127 : +p.keyHigh);
      b.dataset.i = i;
    });
  };
  const keyAt = x => { const r = area.getBoundingClientRect(); return Math.max(0, Math.min(127, LO + Math.floor((x - r.left) / r.width * N))); };
  area.addEventListener("pointerdown", e => {
    const b = e.target.closest(".zb"); if (!b) return;
    e.preventDefault(); area.setPointerCapture(e.pointerId);
    const i = +b.dataset.i, p = partOf(i), r = b.getBoundingClientRect(), grab = Math.max(14, r.width * 0.2);
    const mode = e.clientX - r.left < grab ? 1 : r.right - e.clientX < grab ? 2 : 3;
    drag = { i, mode, k0: keyAt(e.clientX), lo: Math.min(+p.keyLow || 0, p.keyHigh ?? 127), hi: Math.max(+p.keyLow || 0, p.keyHigh ?? 127) };
    holdUntil["perf:Part[" + i + "]@keyLow"] = holdUntil["perf:Part[" + i + "]@keyHigh"] = Date.now() + 60000;
    draw();
  });
  area.addEventListener("pointermove", e => {
    if (!drag || !area.hasPointerCapture(e.pointerId)) return;
    const k = keyAt(e.clientX); let lo = drag.lo, hi = drag.hi;
    if (drag.mode === 1) lo = Math.min(k, hi); else if (drag.mode === 2) hi = Math.max(k, lo);
    else { let d = Math.max(-lo, Math.min(127 - hi, k - drag.k0)); lo += d; hi += d; }
    const P = "Part[" + drag.i + "]", p = partOf(drag.i);
    if (+p.keyLow === lo && +p.keyHigh === hi) return;
    setMany("perf", [[P + "@keyLow", lo], [P + "@keyHigh", hi]]); draw();
  });
  const up = () => { if (!drag) return; const P = "perf:Part[" + drag.i + "]"; holdUntil[P + "@keyLow"] = holdUntil[P + "@keyHigh"] = Date.now() + 800; drag = null; draw(); };
  area.addEventListener("pointerup", up); area.addEventListener("pointercancel", up);
  ctrls.push(() => { if (!drag) draw(); });
  draw();
}

function partKeys(i) {
  const P = "Part[" + i + "]", col = PCOL[i];
  modal("Part " + (i + 1) + ": keys, velocity, channel", g => {
    const r = el("div", "kgrid", "", g); r.style.gap = "10px";
    const nf = v => noteName(v);
    [["Key low", "keyLow", 0, 127, nf, 12], ["Key high", "keyHigh", 0, 127, nf, 12], ["Vel low", "velLow", 1, 127, F.int, 10], ["Vel high", "velHigh", 1, 127, F.int, 10]].forEach(k => {
      const d = el("div", "", "", r); d.style.width = "150px";
      rowStep(d, { label: k[0], target: "perf", path: P + "@" + k[1], lo: k[2], hi: k[3], fmt: k[4], big: k[5], def: k[1] === "keyHigh" || k[1] === "velHigh" ? 127 : k[1] === "velLow" ? 1 : 0 });
    });
    const d2 = el("div", "", "", r); d2.style.width = "150px";
    rowStep(d2, { label: "MIDI ch", target: "perf", path: P + "@channel", lo: 0, hi: 16, fmt: v => v ? String(v) : "All" });
    knob(r, { label: "Detune", target: "perf", path: P + "@detune", lo: -100, hi: 100, c: 0, def: 0, fmt: F.cents, col });
    const r2 = el("div", "row", "", g); r2.style.marginTop = "10px";
    el("button", "", "Full keyboard", r2).onclick = () => setMany("perf", [[P + "@keyLow", 0], [P + "@keyHigh", 127]]);
    el("button", "", "Type range (e.g. C2-B3)", r2).onclick = () => {
      const t = prompt("Key range, e.g. C2-B3", noteName(+partOf(i).keyLow || 0) + "-" + noteName(partOf(i).keyHigh ?? 127)); if (!t) return;
      const [a, b] = t.split(/\s*[-–]\s*/).map(parseNote); if (isNaN(a) || isNaN(b)) return alert("Not understood: " + t);
      setMany("perf", [[P + "@keyLow", Math.max(0, Math.min(a, b))], [P + "@keyHigh", Math.min(127, Math.max(a, b))]]);
    };
    el("button", "", "All velocities", r2).onclick = () => setMany("perf", [[P + "@velLow", 1], [P + "@velHigh", 127]]);
  });
}

function eqBox(title, target, P, bands, col) {
  const box = $("box");
  box.innerHTML = `<div class="row"><b style="flex:1;font-size:16px">${esc(title)}</b><button id="eqx">✕</button></div><div class="kgrid" id="eqk"></div>`;
  const g = $("eqk");
  const before = ctrls.length;
  bands.forEach(b => knob(g, { label: b[0], target, path: P + "@" + b[1], lo: b[2], hi: b[3], c: b[4] ?? 0, def: b[5] ?? 0, fmt: b[6] || F.dbs, col }));
  const mine = ctrls.splice(before);
  const tick = setInterval(() => mine.forEach(f => f()), 150);
  const close = () => { clearInterval(tick); $("modal").classList.remove("open"); };
  $("eqx").onclick = close;
  $("modal").classList.add("open");
  $("modal").onpointerdown = e => { if (e.target.id === "modal") close(); };
}

function pickInstrument(title, current, cb) {
  const go = () => picker(title, instruments.map(n => ({ label: n, value: n })), current, ["(empty)"], (a, v) => cb(a === 0 ? "" : v));
  if (instruments.length) go(); else fetch("/instruments").then(r => r.json()).then(a => { instruments = a; go(); }).catch(go);
}

function msRange(oi, r) {
  const O = "Osc[" + oi + "]", col = PCOL[Math.floor(oi / 8)];
  modal("MS" + (r + 1) + ": key / velocity range", g => {
    const k = el("div", "kgrid", "", g); k.style.gap = "10px";
    [["Key low", "keyLow", 0, 127, noteName, 12, 0], ["Key high", "keyHigh", 0, 127, noteName, 12, 127], ["Vel low", "velLow", 1, 127, F.int, 10, 1], ["Vel high", "velHigh", 1, 127, F.int, 10, 127],
     ["Fade in", "fadeIn", 0, 127, F.int, 10, 0], ["Fade out", "fadeOut", 0, 127, F.int, 10, 0]].forEach(x => {
      const d = el("div", "", "", k); d.style.width = "150px";

  toggle(bar, { label: "Neighbours take keys", get: () => mapOpt.neighbours, set: v => { mapOpt.neighbours = v; } });
  if (M.wav) toggle(bar, { label: "WAV to Recycle Bin", get: () => mapOpt.files, set: v => { mapOpt.files = v; }, onCol: "#ff4d5e" });
  const dz = el("button", "", "DELETE ZONE", bar); dz.style.background = "#5a2230";
  dz.onclick = () => { if (mapSel < 0 || !Z[mapSel]) return alert("Select a zone first."); if (confirm("Delete zone " + Z[mapSel].s + (mapOpt.files ? " and its WAV file" : "") + "? The map is saved right away.")) { api({ op: "mapDelete", zones: [mapSel], neighbours: mapOpt.neighbours, files: mapOpt.files }); mapSel = -1; } };
  const dr = el("button", "", "DELETE RANGE...", bar); dr.style.background = "#5a2230";
  dr.onclick = () => {
    const t = prompt("Delete all zones inside a key range, e.g. C5-C7"); if (!t) return;
    const [a, b] = t.split(/\s*[-–]\s*/).map(parseNote); if (isNaN(a) || isNaN(b)) return alert("Not understood: " + t);
    const lo = Math.min(a, b), hi = Math.max(a, b), n = Z.filter(z => z.lo >= lo && z.hi <= hi).length;
    if (!n) return alert("No zone lies completely inside " + noteName(lo) + "-" + noteName(hi) + ".");
    if (confirm("Delete " + n + " zones in " + noteName(lo) + "-" + noteName(hi) + (mapOpt.files ? " and their WAV files (Recycle Bin)" : "") + "? The map is saved right away.")) { api({ op: "mapDelete", from: lo, to: hi, neighbours: mapOpt.neighbours, files: mapOpt.files }); mapSel = -1; }
  };

  // mapa: x = taster, y = velocity; povuci ivicu ili sredinu zone
  const LO = 0, HI = 127, N = 128;
  const plot = el("div", "", "", m); plot.id = "zmap";
  miniKeys(m, LO, HI);
  const ZC = ["#ff8a3d", "#3dc5ff", "#7ddf64", "#ff5c8a", "#c58aff", "#ffd23d", "#3dffd0", "#ff9be0"];
  let drag = null;
  const drawPlot = () => {
    plot.innerHTML = "";
    Z.forEach((z, i) => {
      const d = el("div", "z" + (i === mapSel ? " sel" : ""), "", plot);
      d.style.left = (z.lo / N * 100) + "%"; d.style.width = ((z.hi - z.lo + 1) / N * 100) + "%";
      d.style.top = ((127 - z.hv) / 127 * 100) + "%"; d.style.height = ((z.hv - z.lv + 1) / 127 * 100) + "%";
      d.style.background = ZC[i % 8]; if (!z.en) d.style.opacity = ".25"; d.dataset.i = i;
    });
  };
  const keyAt = x => { const r = plot.getBoundingClientRect(); return Math.max(0, Math.min(127, Math.floor((x - r.left) / r.width * N))); };
  plot.addEventListener("pointerdown", e => {
    const t = e.target.closest(".z"); if (!t) return;
    e.preventDefault(); plot.setPointerCapture(e.pointerId);
    const i = +t.dataset.i, z = Z[i], r = t.getBoundingClientRect(), grab = Math.max(10, r.width * 0.25);
    mapSel = i;
    drag = { i, mode: e.clientX - r.left < grab ? 1 : r.right - e.clientX < grab ? 2 : 3, k0: keyAt(e.clientX), lo: z.lo, hi: z.hi, root: z.root, moved: false };
    drawPlot(); drawTable();
  });
  plot.addEventListener("pointermove", e => {
    if (!drag || !plot.hasPointerCapture(e.pointerId)) return;
    const k = keyAt(e.clientX); let lo = drag.lo, hi = drag.hi;
    if (drag.mode === 1) lo = Math.min(k, hi); else if (drag.mode === 2) hi = Math.max(k, lo);
    else { const d = Math.max(-lo, Math.min(127 - hi, k - drag.k0)); lo += d; hi += d; }
    const z = Z[drag.i]; if (z.lo === lo && z.hi === hi) return;
    z.lo = lo; z.hi = hi; drag.moved = true;
    api({ op: "mapZone", index: drag.i, set: { lo, hi } });
    drawPlot(); drawTable();
  });
  const up = () => { drag = null; };
  plot.addEventListener("pointerup", up); plot.addEventListener("pointercancel", up);

  // izabrana zona
  const ed = el("div", "sect", "", m);
  // tabela zona
  const tbl = el("table", "zt", "", m);
  const drawTable = () => {
    tbl.innerHTML = "<tr><th>Sample</th><th>Low</th><th>High</th><th>Root</th><th>Vel</th><th>Gain</th><th>Tune</th><th>Loop</th><th>On</th></tr>" +
      Z.map((z, i) => `<tr data-i="${i}" class="${i === mapSel ? "sel" : ""}"><td>${esc(z.s)}</td><td>${noteName(z.lo)}</td><td>${noteName(z.hi)}</td><td>${noteName(z.root)}</td><td>${z.lv}-${z.hv}</td><td>${(+z.gain).toFixed(1)}</td><td>${Math.round(z.tune)}</td><td>${z.loop ? "✓" : ""}</td><td>${z.en ? "✓" : "✕"}</td></tr>`).join("");
    drawEd();
  };
  tbl.onclick = e => { const tr = e.target.closest("tr[data-i]"); if (!tr) return; mapSel = +tr.dataset.i; drawPlot(); drawTable(); };
  const drawEd = () => {
    ed.innerHTML = "";
    const z0 = Z[mapSel];
    if (!z0) { el("div", "hint", "Tap a zone (in the map or in the table) to edit it. Drag its edges or middle in the map.", ed); return; }
    el("h3", "", "ZONE: " + esc(z0.s), ed);
    const z = new Proxy({}, { get: (t, k) => (Z[mapSel] || {})[k], set: (t, k, v) => { if (Z[mapSel]) Z[mapSel][k] = v; return true; } });
    const g = el("div", "kgrid", "", ed); g.style.gap = "10px";
    const fz = (k, v) => { z[k] = v; const s = {}; s[k] = v; api({ op: "mapZone", index: mapSel, set: s }); drawPlot(); };
    [["Low key", "lo", 0, 127, noteName, 12], ["High key", "hi", 0, 127, noteName, 12], ["Root key", "root", 0, 127, noteName, 12], ["Vel low", "lv", 1, 127, F.int, 10], ["Vel high", "hv", 1, 127, F.int, 10]].forEach(x => {
      const d = el("div", "", "", g); d.style.width = "150px";
      rowStep(d, { label: x[0], lo: x[2], hi: x[3], fmt: x[4], big: x[5], get: () => +z[x[1]], set: v => { fz(x[1], v); tbl.querySelector(`tr[data-i="${mapSel}"]`) && drawTableRows(); } });
    });
    knob(g, { label: "Gain", lo: -40, hi: 12, c: 0, def: 0, fmt: F.dbs, col: "#ff8a3d", get: () => +z.gain, set: v => fz("gain", Math.round(v * 10) / 10) });
    knob(g, { label: "Tune", lo: -100, hi: 100, c: 0, def: 0, fmt: F.cents, col: "#ff8a3d", get: () => +z.tune, set: v => fz("tune", Math.round(v)) });
    knob(g, { label: "Pan", lo: -1, hi: 1, c: 0, def: 0, fmt: F.pan, col: "#ff8a3d", get: () => +z.pan, set: v => fz("pan", v) });
    const t = el("div", "row", "", ed); t.style.marginTop = "6px";
    toggle(t, { label: "LOOP", get: () => !!z.loop, set: v => fz("loop", v) });
    toggle(t, { label: "FIXED PITCH", get: () => !!z.fixed, set: v => fz("fixed", v), title: "Same pitch on all keys (drums)" });
    toggle(t, { label: "ZONE ON", get: () => !!z.en, set: v => fz("en", v), onCol: "#3ddc84" });
  };
  const drawTableRows = () => { const sel = mapSel; tbl.querySelectorAll("tr[data-i]").forEach(tr => { const z = Z[+tr.dataset.i]; tr.children[1].textContent = noteName(z.lo); tr.children[2].textContent = noteName(z.hi); tr.children[3].textContent = noteName(z.root); tr.children[4].textContent = z.lv + "-" + z.hv; tr.children[5].textContent = (+z.gain).toFixed(1); tr.children[6].textContent = Math.round(z.tune); tr.children[7].textContent = z.loop ? "✓" : ""; tr.children[8].textContent = z.en ? "✓" : "✕"; }); };
  drawPlot(); drawTable();
  // izmene sa PC-a (ili potvrda sa servera): osvezi mapu i tabelu, osim dok se vuce
  ctrls.push(() => { if (drag || !S.map || !S.map.zones || S.map.zones.length !== Z.length) return; Z = S.map.zones; drawPlot(); drawTableRows(); });
  el("div", "hint", "Changes play right away; SAVE MAP writes LiveSampler-mapa.xml so they stay. The map applies to every user that uses this multisample.", m).style.marginTop = "6px";
}

// ---------- HARMONY ----------
function tSend() { api({ op: "terca", data: S.terca }); }
function buildHarm(m) {
  const T = S.terca; if (!T) { el("div", "hint", "Loading...", m); return; }
  // stanje stize ponovo posle svake izmene: uvek citaj iz S.terca
  const SC = () => (S.terca.Scale = S.terca.Scale || []), RU = () => (S.terca.Rule = S.terca.Rule || []);
  const scales = SC(), rules = RU();
  if (tScale >= scales.length) tScale = 0;
  const top = el("div", "row", "", m);
  const on = el("button", "", "", top); on.style.minWidth = "140px"; on.style.fontSize = "18px";
  on.onclick = () => api({ op: "harmony", on: !S.terca.on });
  const st = el("div", "", "", top); st.style.cssText = "flex:1;background:var(--lcdbg);border-radius:10px;padding:8px 14px;color:var(--lcd);font-size:22px;font-weight:700";
  const lb = el("button", "", "", top);
  lb.onclick = () => api({ op: "tercaLearn" });
  ctrls.push(() => { on.textContent = S.terca.on ? "HARMONY ON" : "HARMONY OFF"; on.style.background = S.terca.on ? "#3ddc84" : ""; on.style.color = S.terca.on ? "#111" : ""; st.textContent = S.terca.text || "—";
    lb.textContent = S.terca.learning ? "LEARNING... press a key / CC" : "LEARN button: " + (S.terca.learnText || "none"); lb.style.background = S.terca.learning ? "#ffb340" : ""; lb.style.color = S.terca.learning ? "#111" : ""; });

  const k = el("div", "sect", "", m); el("h3", "", "KEY (also recognized from the chord while holding HARMONY)", k);
  const nr = el("div", "notes", "", k);
  NN.forEach((n, i) => { const b = el("button", "", n, nr); b.onclick = () => api({ op: "tercaKey", root: i, scale: S.terca.scale }); ctrls.push(() => b.classList.toggle("on", S.terca.root === i)); });
  const sr = el("div", "seg", "", k); sr.style.marginTop = "6px";
  scales.forEach((s, i) => { const b = el("button", "", esc(s.name), sr); b.onclick = () => api({ op: "tercaKey", root: S.terca.root, scale: i }); ctrls.push(() => b.classList.toggle("on", S.terca.scale === i)); });

  const o = el("div", "sect", "", m); el("h3", "", "VOICES", o);
  const orow = el("div", "row", "", o);
  ["Third above", "Third below", "Above and below"].forEach((t, i) => { const b = el("button", "", t, orow); b.onclick = () => { S.terca.voiceMode = i; tSend(); }; ctrls.push(() => b.classList.toggle("on", +S.terca.voiceMode === i)); });
  toggle(orow, { label: "Top note only (melody)", get: () => !!+S.terca.topNoteOnly, set: v => { S.terca.topNoteOnly = v; tSend(); } });
  knob(orow, { label: "Velocity", lo: 0.1, hi: 1.5, c: 0.8, def: 0.8, fmt: F.pct, col: "#3ddc84", get: () => +S.terca.velocity, set: v => { S.terca.velocity = v; tSend(); } });

  const sc = el("div", "sect", "", m); el("h3", "", "SCALES: interval for each step (semitones above / below the played note, 0 = no harmony on that step)", sc);
  const sh = el("div", "row", "", sc);
  scales.forEach((s, i) => { const b = el("button", i === tScale ? "on" : "", esc(s.name), sh); b.onclick = () => { tScale = i; built = ""; render(); }; });
  el("span", "", "", sh).style.flex = "1";
  el("button", "small", "RENAME", sh).onclick = () => { const n = prompt("Scale name", SC()[tScale].name); if (n && n.trim()) { SC()[tScale].name = n.trim(); tSend(); built = ""; render(); } };
  el("button", "small", "NEW SCALE", sh).onclick = () => { const s = SC(), cp = JSON.parse(JSON.stringify(s[tScale])); cp.name = "User scale " + (s.length + 1); s.push(cp); tScale = s.length - 1; tSend(); built = ""; render(); };
  const ds = el("button", "small", "DELETE", sh); ds.style.background = "#5a2230";
  ds.onclick = () => { const s = SC(); if (s.length <= 1) return; if (!confirm("Delete scale " + s[tScale].name + "?")) return; const idx = tScale; s.splice(idx, 1); RU().forEach(r => { if (+r.scale === idx) r.scale = 0; else if (+r.scale > idx) r.scale--; }); tScale = 0; tSend(); built = ""; render(); };
  const arr = (s, key) => String(s[key] ?? "").trim().split(/\s+/).map(Number).concat(Array(12).fill(0)).slice(0, 12);
  const g = el("div", "notes", "", sc); g.style.marginTop = "6px";
  for (let i = 0; i < 12; i++) {
    const cell = el("div", "", "", g);
    el("div", "lab", NN[(S.terca.root + i) % 12] + " (" + i + ")", cell).style.textAlign = "center";
    ["above", "below"].forEach(key => stpx(cell, { label: key === "above" ? "above" : "below", lo: -12, hi: 12,
      get: () => arr(S.terca.Scale[tScale], key)[i],
      set: v => { const a = arr(S.terca.Scale[tScale], key); a[i] = v; S.terca.Scale[tScale][key] = a.join(" "); tSend(); } }));
  }

  const rl = el("div", "sect", "", m); el("h3", "", "CHORD RULES: chord notes from the root → scale (first match wins)", rl);
  rules.forEach((r0, ri) => {
    const r = new Proxy({}, { get: (t, k) => (RU()[ri] || {})[k], set: (t, k, v) => { if (RU()[ri]) RU()[ri][k] = v; return true; } });
    const row = el("div", "row", "", rl); row.style.marginTop = "4px";
    const nn = el("div", "notes", "", row); nn.style.flex = "1 1 420px";
    for (let b = 0; b < 12; b++) { const x = el("button", "", String(b), nn); x.title = "semitones from the chord root"; x.onclick = () => { r.mask = (+r.mask) ^ (1 << b); tSend(); }; ctrls.push(() => x.classList.toggle("on", !!((+r.mask) & (1 << b)))); }
    const sb = el("button", "", "", row); sb.onclick = () => picker("Scale for this rule", SC().map((s, i) => ({ label: s.name, value: i })), +r.scale, [], (a, v) => { r.scale = v; tSend(); });
    ctrls.push(() => { sb.textContent = (SC()[+r.scale] || {}).name || "?"; });
    const sd = el("div", "", "", row); sd.style.width = "150px";
    rowStep(sd, { label: "Shift", lo: -11, hi: 11, get: () => +r.rootShift, set: v => { r.rootShift = v; tSend(); } });
    const x = el("button", "", "✕", row); x.style.background = "#5a2230"; x.onclick = () => { RU().splice(ri, 1); tSend(); built = ""; render(); };
  });
  el("button", "", "+ Add rule", rl).onclick = () => { RU().push({ mask: 1 | 16 | 128, scale: 0, rootShift: 0 }); tSend(); built = ""; render(); };
}

// ---------- render ----------
function render() {
  const st = S.status || {};
  $("slotLine").textContent = "PERFORMANCE " + (st.slotText || "---") + (st.list ? "  ·  " + st.list : "") + "  ·  " + (st.voices || 0) + " voices";
  $("perfName").textContent = (st.name || "—") + (st.dirty ? " *" : "");
  $("harm").classList.toggle("on", !!st.harm);
  $("harmText").textContent = (st.harm ? "ON  " : "OFF  ") + (st.harmText || "");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!S.perf) return;
  let key = tab + "|" + partPage + "|" + osc + "|" + section + "|" + (tab === "user" ? S.user.index + "|" + (S.user.data ? 1 : 0) + "|" + S.users.list.length + "|" + (S.user.data ? S.user.data.name + S.user.data.category : "") : "") + "|" + (tab === "perf" ? S.users.list.length : "");
  // stranice koje se crtaju iz stanja: ponovo kad se promeni ono sto vidis
  if (tab === "lists") key += "|" + listSub + listMode + slPage + slMode + "|" + JSON.stringify(listSub === "perf" ? S.lists && [S.lists.bank, S.lists.cur, S.lists.banks, S.lists.slots.slice(S.lists.bank * 128, S.lists.bank * 128 + 128)] : S.setlist);
  if (tab === "map") key += "|" + JSON.stringify(S.map && [S.map.name, S.map.loaded, S.map.dirty, S.map.userInst, (S.map.zones || []).length]) + mapSel;
  if (tab === "harm") key += "|" + tScale + "|" + JSON.stringify(S.terca && [(S.terca.Scale || []).map(s => s.name), (S.terca.Rule || []).length]);
  if (key !== built) {
    built = key; ctrls = [];
    const m = $("main"); const sc = m.scrollTop; m.innerHTML = "";
    if (tab === "perf") buildPerf(m); else if (tab === "user") buildUser(m); else if (tab === "lists") buildLists(m); else if (tab === "map") buildMap(m); else if (tab === "harm") buildHarm(m); else buildFx(m);
    m.scrollTop = sc;
  }
  ctrls.forEach(f => f());
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab; built = "";
  if (tab === "user" && S.user.index < 0 && S.status.remoteUser >= 0) api({ op: "editUser", index: S.status.remoteUser });
  render();
});
$("prev").onclick = () => api({ op: "step", dir: -1 });
$("next").onclick = () => api({ op: "step", dir: 1 });
$("save").onclick = () => { if (!(S.status.slot >= 0)) return alert("This performance has no slot yet: save it once on the PC (LISTS)."); if (confirm("Save \"" + S.status.name + "\" to " + S.status.slotText + "?")) api({ op: "store" }); };
$("harm").onclick = () => api({ op: "harmony", on: !S.status.harm });
$("panic").onclick = () => api({ op: "panic" });
$("back").onclick = () => { try { window.parent.postMessage("pikaso-close", "*"); } catch (e) {} };
if (window.parent === window) $("back").style.display = "none";
connect();
setInterval(() => { if (!connected) connect(); }, 4000);
setConn(false);
</script>
</body>
</html>
