name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PikasoWorkstation-Windows
          path: |
            build/LiveSampler_artefacts/Release/Standalone/*.exe
            build/LiveSampler_artefacts/Release/VST3/

      - name: Upload Autosampler
        uses: actions/upload-artifact@v4
        with:
          name: PikasoAutosampler-Windows
          path: build/KronosAutosampler_artefacts/Release/*.exe

      # Najnovija verzija uvek na istoj adresi (Release "latest"), za automatsko skidanje na racunar
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/LiveSampler_artefacts/Release/Standalone/*.exe","build/LiveSampler_artefacts/Release/VST3" -DestinationPath dist/PikasoWorkstation-Windows.zip -Force
          Compress-Archive -Path "build/KronosAutosampler_artefacts/Release/*.exe" -DestinationPath dist/PikasoAutosampler-Windows.zip -Force

      - name: Publish latest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $msg = (git log -1 --pretty=%s)
          gh release create latest dist/PikasoWorkstation-Windows.zip dist/PikasoAutosampler-Windows.zip --title "Najnovija verzija" --notes "$msg" --target $env:GITHUB_SHA --latest
